<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="discW" cx="50%" cy="45%" r="62%">
      <stop offset="0%" stop-color="#1B2740"/>
      <stop offset="70%" stop-color="#141D31"/>
      <stop offset="100%" stop-color="#101828"/>
    </radialGradient>
    <radialGradient id="glowW" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EFE7D4" stop-opacity="0.50"/>
      <stop offset="55%" stop-color="#EFE7D4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#EFE7D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="asanohaCW" width="60" height="104" patternUnits="userSpaceOnUse">
      <g stroke="#B8945F" stroke-width="1" fill="none" opacity="0.07">
        <path d="M30 0 L60 17 L60 52 L30 69 L0 52 L0 17 Z"/>
        <path d="M30 0 L30 69 M0 17 L60 52 M60 17 L0 52"/>
        <path d="M30 52 L0 69 M30 52 L60 69"/>
      </g>
    </pattern>
    <clipPath id="clipDiscW">
      <circle cx="400" cy="500" r="300"/>
    </clipPath>
  </defs>

  <rect width="800" height="1000" fill="#33456B"/>
  <rect width="800" height="1000" fill="url(#asanohaCW)"/>

  <g fill="none" stroke="#B8945F" opacity="0.20">
    <circle cx="400" cy="500" r="330" stroke-width="1"/>
    <circle cx="400" cy="500" r="362" stroke-width="0.8"/>
  </g>

  <circle cx="400" cy="500" r="300" fill="url(#discW)"/>

  <g clip-path="url(#clipDiscW)">
    <!-- rings, each with a gap : the interruption -->
    <g fill="none" stroke="#B8945F" stroke-linecap="round">
      <path d="M400 434 A 66 66 0 1 1 353 453" stroke-width="1.6" opacity="0.70"/>
      <path d="M400 388 A 112 112 0 1 1 320 421" stroke-width="1.4" opacity="0.54"/>
      <path d="M400 336 A 164 164 0 1 1 284 384" stroke-width="1.3" opacity="0.40"/>
      <path d="M400 284 A 216 216 0 1 1 247 347" stroke-width="1.2" opacity="0.26"/>
      <path d="M400 232 A 268 268 0 1 1 211 310" stroke-width="1.1" opacity="0.15"/>
    </g>

    <line x1="100" y1="500" x2="700" y2="500" stroke="#EFE7D4" stroke-width="0.9" opacity="0.16"/>

    <!-- wave with a flat interruption in the middle -->
    <path d="M100,556 C136,494 172,618 208,556 C244,494 280,618 316,556
             L400,556
             C436,494 472,618 508,556 C544,494 580,618 616,556 C652,506 676,540 700,548"
          fill="none" stroke="#B8945F" stroke-width="2.2" opacity="0.48" stroke-linecap="round"/>

    <ellipse cx="400" cy="330" rx="230" ry="70" fill="#EFE7D4" opacity="0.045"/>
  </g>

  <circle cx="400" cy="500" r="92" fill="url(#glowW)"/>
  <circle cx="400" cy="500" r="28" fill="#EFE7D4"/>
  <circle cx="400" cy="500" r="28" fill="none" stroke="#B8945F" stroke-width="1.2" opacity="0.7"/>

  <circle cx="400" cy="500" r="300" fill="none" stroke="#B8945F" stroke-width="1.4" opacity="0.5"/>

  <g fill="#EFE7D4">
    <circle cx="292" cy="302" r="4.4" opacity="0.26"/>
    <circle cx="540" cy="286" r="3.6" opacity="0.20"/>
    <circle cx="596" cy="416" r="3.2" opacity="0.22"/>
    <circle cx="236" cy="648" r="4" opacity="0.18"/>
    <circle cx="562" cy="690" r="4.6" opacity="0.22"/>
    <circle cx="400" cy="754" r="3.2" opacity="0.16"/>
  </g>
</svg>
