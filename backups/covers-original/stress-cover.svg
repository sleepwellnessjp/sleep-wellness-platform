<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="discS" cx="50%" cy="45%" r="62%">
      <stop offset="0%" stop-color="#1B2740"/>
      <stop offset="70%" stop-color="#141D31"/>
      <stop offset="100%" stop-color="#101828"/>
    </radialGradient>
    <radialGradient id="glowS" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EFE7D4" stop-opacity="0.50"/>
      <stop offset="55%" stop-color="#EFE7D4" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#EFE7D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="asanohaCS" width="60" height="104" patternUnits="userSpaceOnUse">
      <g stroke="#B8945F" stroke-width="1" fill="none" opacity="0.07">
        <path d="M30 0 L60 17 L60 52 L30 69 L0 52 L0 17 Z"/>
        <path d="M30 0 L30 69 M0 17 L60 52 M60 17 L0 52"/>
        <path d="M30 52 L0 69 M30 52 L60 69"/>
      </g>
    </pattern>
    <clipPath id="clipDiscS">
      <circle cx="400" cy="500" r="300"/>
    </clipPath>
  </defs>

  <rect width="800" height="1000" fill="#33456B"/>
  <rect width="800" height="1000" fill="url(#asanohaCS)"/>

  <g fill="none" stroke="#B8945F" opacity="0.20">
    <circle cx="400" cy="500" r="330" stroke-width="1"/>
    <circle cx="400" cy="500" r="362" stroke-width="0.8"/>
  </g>

  <circle cx="400" cy="500" r="300" fill="url(#discS)"/>

  <g clip-path="url(#clipDiscS)">
    <!-- taut rings, progressively pulled off-centre -->
    <g fill="none" stroke="#B8945F">
      <ellipse cx="400" cy="500" rx="58"  ry="58"  stroke-width="1.6" opacity="0.72"/>
      <ellipse cx="404" cy="497" rx="102" ry="96"  stroke-width="1.4" opacity="0.56"/>
      <ellipse cx="411" cy="492" rx="152" ry="138" stroke-width="1.3" opacity="0.42"/>
      <ellipse cx="421" cy="485" rx="206" ry="182" stroke-width="1.2" opacity="0.28"/>
      <ellipse cx="434" cy="476" rx="264" ry="228" stroke-width="1.1" opacity="0.16"/>
    </g>

    <!-- horizon -->
    <line x1="100" y1="500" x2="700" y2="500" stroke="#EFE7D4" stroke-width="0.9" opacity="0.18"/>

    <!-- strained wave : tight on the left, easing to the right -->
    <path d="M100,548 C124,486 148,610 172,548 C196,492 220,604 244,548 C272,498 300,596 328,548 C362,502 396,590 430,548 C472,506 514,580 556,548 C602,516 650,566 700,544"
          fill="none" stroke="#B8945F" stroke-width="2.2" opacity="0.50" stroke-linecap="round"/>

    <ellipse cx="400" cy="330" rx="230" ry="70" fill="#EFE7D4" opacity="0.045"/>
  </g>

  <circle cx="400" cy="500" r="92" fill="url(#glowS)"/>
  <circle cx="400" cy="500" r="28" fill="#EFE7D4"/>
  <circle cx="400" cy="500" r="28" fill="none" stroke="#B8945F" stroke-width="1.2" opacity="0.7"/>

  <circle cx="400" cy="500" r="300" fill="none" stroke="#B8945F" stroke-width="1.4" opacity="0.5"/>

  <g fill="#EFE7D4">
    <circle cx="272" cy="308" r="4.6" opacity="0.28"/>
    <circle cx="534" cy="292" r="3.8" opacity="0.20"/>
    <circle cx="602" cy="404" r="3.2" opacity="0.24"/>
    <circle cx="230" cy="640" r="4" opacity="0.18"/>
    <circle cx="556" cy="694" r="4.8" opacity="0.22"/>
    <circle cx="398" cy="750" r="3.2" opacity="0.16"/>
  </g>
</svg>
