<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="睡眠データとリブレ2のCSVを分析画面に取り込み、カルテに保存する" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="goldhead" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#B99452"/>
    </marker>
  </defs>

  <!-- 入力もと -->
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
    <rect x="40" y="70" width="290" height="150" rx="22" fill="#FFFFFF" stroke="#D7DBE4" stroke-width="2.5"/>
    <circle cx="100" cy="145" r="22" fill="none" stroke="#C8A96A" stroke-width="9"/>
    <text x="148" y="136" font-size="30" fill="#1B2B4B">睡眠データ</text>
    <text x="148" y="176" font-size="24" fill="#6B7590">スマートリング</text>

    <rect x="40" y="280" width="290" height="150" rx="22" fill="#FFFFFF" stroke="#D7DBE4" stroke-width="2.5"/>
    <path d="M80 320 H112 L126 334 V386 H80 Z" fill="#FFFFFF" stroke="#1B2B4B" stroke-width="3" stroke-linejoin="round"/>
    <path d="M112 320 V334 H126" fill="none" stroke="#1B2B4B" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#C8A96A" stroke-width="3" stroke-linecap="round">
      <path d="M90 350 H116 M90 362 H116 M90 374 H106"/>
    </g>
    <text x="148" y="346" font-size="30" fill="#1B2B4B">血糖データ</text>
    <text x="148" y="386" font-size="24" fill="#6B7590">リブレ2のCSV</text>
  </g>

  <!-- 取り込みの流れ -->
  <g fill="none" stroke="#B99452" stroke-width="4" marker-end="url(#goldhead)">
    <path d="M344 145 C400 145 404 186 444 192"/>
    <path d="M344 355 C400 355 404 314 444 308"/>
  </g>

  <!-- 分析画面 -->
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
    <rect x="466" y="120" width="294" height="240" rx="22" fill="#FFFFFF" stroke="#1B2B4B" stroke-width="3"/>
    <path d="M466 142 A22 22 0 0 1 488 120 H738 A22 22 0 0 1 760 142 V166 H466 Z" fill="#1B2B4B"/>
    <text x="492" y="153" font-size="26" fill="#FFFFFF">分析画面</text>
    <g fill="#E7EAF1">
      <rect x="498" y="268" width="26" height="46" rx="6"/>
      <rect x="538" y="248" width="26" height="66" rx="6"/>
      <rect x="578" y="284" width="26" height="30" rx="6"/>
      <rect x="618" y="256" width="26" height="58" rx="6"/>
      <rect x="658" y="276" width="26" height="38" rx="6"/>
      <rect x="698" y="262" width="26" height="52" rx="6"/>
    </g>
    <path d="M498 224 C546 206 580 242 628 226 C672 212 700 232 724 222" fill="none" stroke="#C8A96A" stroke-width="5" stroke-linecap="round"/>
    <path d="M492 330 H730" stroke="#D7DBE4" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 保存先 -->
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
    <path d="M613 360 V404" fill="none" stroke="#B99452" stroke-width="4" marker-end="url(#goldhead)"/>
    <rect x="466" y="418" width="294" height="60" rx="16" fill="#F4F2EB"/>
    <rect x="492" y="433" width="38" height="30" rx="7" fill="#FFFFFF" stroke="#1B2B4B" stroke-width="2.5"/>
    <path d="M500 443 H522 M500 453 H514" stroke="#C8A96A" stroke-width="3" stroke-linecap="round"/>
    <text x="546" y="459" font-size="30" fill="#1B2B4B">カルテに保存</text>
  </g>
</svg>
