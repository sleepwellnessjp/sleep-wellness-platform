<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="睡眠の推移と夜間グルコースを重ねて読み、改善の優先順位を整理する" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <!-- 凡例 -->
    <g font-size="26">
      <path d="M90 62 H128" stroke="#1B2B4B" stroke-width="5" stroke-linecap="round"/>
      <text x="140" y="71" fill="#1B2B4B">睡眠</text>
      <path d="M232 62 H270" stroke="#C8A96A" stroke-width="5" stroke-linecap="round"/>
      <text x="282" y="71" fill="#1B2B4B">グルコース</text>
    </g>

    <!-- 目盛 -->
    <g stroke="#E6E3DA" stroke-width="2">
      <path d="M90 130 H740 M90 230 H740 M90 330 H740"/>
    </g>

    <!-- 重なる時間帯 -->
    <rect x="452" y="100" width="104" height="244" rx="10" fill="#C8A96A" opacity="0.14"/>
    <text x="504" y="92" font-size="24" fill="#B99452" text-anchor="middle">重なる時間帯</text>

    <!-- 睡眠段階 -->
    <path d="M100 152 H184 V206 H262 V134 H336 V212 H424 V142 H528 V208 H626 V146 H734"
          fill="none" stroke="#1B2B4B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- グルコース -->
    <path d="M100 300 C158 300 188 272 238 270 C296 268 328 300 386 296 C446 292 468 244 538 250 C608 256 650 292 734 288"
          fill="none" stroke="#C8A96A" stroke-width="5" stroke-linecap="round"/>
    <circle cx="512" cy="250" r="8" fill="#B99452"/>

    <!-- 時刻 -->
    <path d="M90 344 H740" stroke="#1B2B4B" stroke-width="3" stroke-linecap="round"/>
    <g font-size="24" fill="#6B7590">
      <text x="96" y="378">22時</text>
      <text x="400" y="378" text-anchor="middle">2時</text>
      <text x="734" y="378" text-anchor="end">6時</text>
    </g>

    <!-- 優先順位 -->
    <text x="90" y="420" font-size="26" fill="#1B2B4B">改善の優先順位</text>
    <g>
      <rect x="90" y="436" width="212" height="52" rx="14" fill="#F4F2EB"/>
      <circle cx="120" cy="462" r="15" fill="#B99452"/>
      <text x="120" y="471" font-size="22" fill="#FFFFFF" text-anchor="middle">1</text>
      <text x="146" y="471" font-size="24" fill="#1B2B4B">食事の時間</text>

      <rect x="309" y="436" width="212" height="52" rx="14" fill="#F4F2EB"/>
      <circle cx="339" cy="462" r="15" fill="#B99452"/>
      <text x="339" y="471" font-size="22" fill="#FFFFFF" text-anchor="middle">2</text>
      <text x="365" y="471" font-size="24" fill="#1B2B4B">中途覚醒</text>

      <rect x="528" y="436" width="212" height="52" rx="14" fill="#F4F2EB"/>
      <circle cx="558" cy="462" r="15" fill="#B99452"/>
      <text x="558" y="471" font-size="22" fill="#FFFFFF" text-anchor="middle">3</text>
      <text x="584" y="471" font-size="24" fill="#1B2B4B">就寝前の呼吸</text>
    </g>
  </g>
</svg>
