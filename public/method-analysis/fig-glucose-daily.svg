<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="640" height="400" fill="#FBF9F5"/>

  <text x="40" y="42" font-size="15" font-weight="700" fill="#2E3F5C">1日のグルコース推移（15分ごとの記録）</text>

  <!-- 目標範囲の帯 70-180 -->
  <rect x="70" y="150" width="500" height="120" fill="#E9F0E6" opacity="0.85"/>
  <text x="566" y="166" font-size="10" fill="#7C9070" text-anchor="end">目標範囲</text>

  <!-- 夜間帯の網かけ -->
  <rect x="70" y="80" width="167" height="230" fill="#DDE3EC" opacity="0.45"/>
  <text x="153" y="98" font-size="11" fill="#5A6A85" text-anchor="middle">夜間帯（入眠〜起床）</text>

  <!-- 軸 -->
  <line x1="70" y1="80" x2="70" y2="310" stroke="#8A93A3" stroke-width="1"/>
  <line x1="70" y1="310" x2="570" y2="310" stroke="#8A93A3" stroke-width="1"/>

  <!-- 目盛 -->
  <g font-size="10" fill="#8A93A3" text-anchor="end">
    <text x="62" y="154">180</text>
    <text x="62" y="214">120</text>
    <text x="62" y="274">70</text>
  </g>
  <text x="62" y="92" font-size="10" fill="#8A93A3" text-anchor="end">mg/dL</text>

  <!-- 推移カーブ -->
  <path d="M78,248 C92,244 100,252 112,250 C124,248 132,254 144,251
           C158,248 166,244 178,247 C190,250 198,246 210,248
           C222,250 230,256 240,254 C252,251 260,236 274,232
           C288,228 296,234 308,231 C322,227 330,220 344,218
           C356,216 364,222 376,224 C390,226 398,229 410,227
           C424,224 432,228 444,226 C458,223 466,206 478,202
           C490,199 500,210 512,214 C528,219 544,222 562,220"
        fill="none" stroke="#2E3F5C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 現在点 -->
  <circle cx="562" cy="220" r="5.5" fill="#B8935A"/>

  <!-- 時刻 -->
  <g font-size="10" fill="#8A93A3" text-anchor="middle">
    <text x="70" y="330">0時</text>
    <text x="195" y="330">6時</text>
    <text x="320" y="330">12時</text>
    <text x="445" y="330">18時</text>
    <text x="570" y="330">24時</text>
  </g>

  <text x="40" y="368" font-size="11" fill="#7A8497">分析では、このうち入眠から起床までを切り出して読み解く。</text>
</svg>
